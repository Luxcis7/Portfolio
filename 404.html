<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- GitHub Pages serves this for any missing path, at any depth: resolve every link from the site root -->
    <base href="https://luxcis7.github.io/Portfolio/">
    <title>Page not found — Boss Graphix</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0e0a18">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600&amp;display=swap">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .lost {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 48px 20px;
            text-align: center;
        }

        .lost__code {
            font-family: var(--font-display);
            font-weight: 900;
            font-stretch: 125%;
            font-size: clamp(96px, 22vw, 240px);
            line-height: 0.9;
            letter-spacing: -0.03em;
            color: var(--purple-400);
        }

        .lost h1 {
            margin-top: 20px;
            font-size: clamp(28px, 4vw, 44px);
        }

        .lost p {
            max-width: 46ch;
            margin: 14px auto 0;
            color: var(--text-muted);
            font-size: 18px;
        }

        .lost__actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 32px;
        }

        .lost__strip {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 48px;
        }

        .lost__strip img {
            width: clamp(72px, 14vw, 140px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 14px;
            opacity: 0.85;
        }

        .lost__strip img:nth-child(odd) {
            transform: translateY(10px) rotate(-3deg);
        }

        .lost__strip img:nth-child(even) {
            transform: rotate(3deg);
        }
    </style>
</head>

<body>
    <main class="lost">
        <div>
            <a href="index.html" aria-label="Boss Graphix home"><img src="images/boss-graphix-logo.webp" alt="Boss Graphix" width="160" style="margin: 0 auto 28px; height: auto;"></a>
            <div class="lost__code" aria-hidden="true">404</div>
            <h1>This page is out of bounds</h1>
            <p>The link may be old or mistyped. The designs are all still here — pick up the play from one of these.</p>
            <div class="lost__actions">
                <a class="btn btn--primary" href="index.html">Back to home</a>
                <a class="btn btn--ghost" href="jersey-design.html">See the jerseys</a>
                <a class="btn btn--ghost" href="index.html#contact">Contact me</a>
            </div>
            <div class="lost__strip" aria-hidden="true">
                <img src="images/thumbs/Jersey/new/2026/holy-rosary-academy-fire-nation.jpg" alt="" width="480" height="480">
                <img src="images/thumbs/Jersey/new/2026/district-2-tapon.jpg" alt="" width="480" height="480">
                <img src="images/thumbs/Jersey/new/2026/medina-empire.jpg" alt="" width="480" height="480">
                <img src="images/thumbs/Jersey/new/2026/jokerz-esports-jersey.jpg" alt="" width="480" height="480">
            </div>
        </div>
    </main>
</body>

</html>
